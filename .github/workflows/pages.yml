name: Check and deploy Math Videos
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      domain_configured: ${{ steps.domain.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check for a standalone custom domain
        id: domain
        shell: bash
        env:
          PUBLISH_SITE: ${{ vars.PUBLISH_SITE }}
        run: |
          if [ -s CNAME ] && [ "$PUBLISH_SITE" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Publishing is disabled until the separate domain is owned, configured, and PUBLISH_SITE is enabled."
          fi
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && steps.domain.outputs.configured == 'true'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.outputs.domain_configured == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the separate domain in Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DOMAIN: mathematics-videos.com
        shell: bash
        run: |
          actual_domain=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .cname)
          if [ "$actual_domain" != "$EXPECTED_DOMAIN" ]; then
            echo "Configure the separate custom domain in this repository's Pages settings before publishing."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
